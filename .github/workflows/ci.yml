name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --dev --extra cpu --no-extra cuda
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  pyrefly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --dev --extra cpu --no-extra cuda
      - run: uv run --no-sync pyrefly check

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --dev --extra cpu --no-extra cuda
      - run: uv run --no-sync pytest -n auto --cov --cov-report=term-missing
