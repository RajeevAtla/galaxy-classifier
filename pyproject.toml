[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "galaxy-classifier"
version = "0.1.0"
description = "Galaxy10 DECaLS image classifier"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flax>=0.10",
    "grain>=0.2,<0.2.14",
    "dm-tree==0.1.9",
    "tensorstore==0.1.69",
    "h5py==3.12.1",
    "numpy==2.2.6",
    "scipy==1.15.1",
    "ml-dtypes==0.5.1",
    "optax>=0.2",
    "orbax-checkpoint>=0.11",
]

[project.optional-dependencies]
cpu = ["jax==0.6.2"]
cuda = ["jax[cuda13]>=0.10,<0.11"]
train = ["tensorboard>=2.18"]

[project.scripts]
galaxy-classifier = "galaxy_classifier.cli:main"

[dependency-groups]
dev = [
    "pyrefly>=0.18",
    "pytest>=8.3",
    "pytest-cov>=5",
    "pytest-xdist[psutil]>=3.6",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/galaxy_classifier"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["galaxy_classifier"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
